name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag version
        id: version
        run: |
          TAG=${{ github.ref_name }}
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: F3D-DCM ${{ github.ref_name }}
          body: |
            F3D-DCM (Fast and minimalist 3D viewer with DICOM support) release ${{ github.ref_name }}
            
            **Changes:**
            - See [CHANGELOG](https://github.com/Nosenzor/f3d-dcm/blob/${{ github.ref_name }}/doc/CHANGELOG.md)
            
            **Assets:**
            - macOS (ARM64) - Apple Silicon
            - Windows (x64)
            - Linux (x64)
          draft: false
          prerelease: false

  # Build and package for macOS
  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja vtk@9.6

      - name: Configure
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DF3D_MACOS_BUNDLE=ON \
            -DF3D_PLUGIN_BUILD_OPEN3SDCM=ON \
            -DF3D_PLUGIN_BUILD_HDF=ON \
            -DF3D_MODULE_UI=ON \
            -DF3D_MODULE_TINYFILEDIALOGS=ON \
            -DF3D_MODULE_DMON=ON \
            -G Ninja

      - name: Build
        run: cmake --build build-release -j$(sysctl -n hw.ncpu)

      - name: Create macOS app bundle
        run: |
          # Copy binary and resources into app bundle
          mkdir -p build-release/F3D-DCM.app/Contents/MacOS
          mkdir -p build-release/F3D-DCM.app/Contents/Resources
          cp build-release/bin/f3d.app/Contents/MacOS/f3d build-release/F3D-DCM.app/Contents/MacOS/
          cp resources/logo.icns build-release/F3D-DCM.app/Contents/Resources/
          cp resources/Info.plist build-release/F3D-DCM.app/Contents/
          
          # Copy libraries
          mkdir -p build-release/F3D-DCM.app/Contents/Frameworks
          cp build-release/lib/*.dylib build-release/F3D-DCM.app/Contents/Frameworks/
          cp build-release/lib/f3d-plugin-*.dylib build-release/F3D-DCM.app/Contents/Frameworks/ 2>/dev/null || true
          
          # Fix rpaths
          install_name_tool -change @rpath/libf3d.3.dylib @executable_path/../Frameworks/libf3d.3.dylib build-release/F3D-DCM.app/Contents/MacOS/f3d

      - name: Create DMG
        run: |
          # Create DMG using macOS built-in tools
          mkdir -p dmg-content
          cp -R build-release/F3D-DCM.app dmg-content/
          hdiutil create -volname "F3D-DCM-${{ github.ref_name }}" \
            -srcfolder dmg-content \
            -ov -format UDBZ \
            F3D-DCM-${{ github.ref_name }}-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: F3D-DCM-${{ github.ref_name }}-macOS.dmg
          asset_name: F3D-DCM-${{ github.ref_name }}-macOS.dmg
          asset_content_type: application/x-apple-diskimage

  # Build for Windows
  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install dependencies
        run: |
          choco install cmake ninja -y
          # VTK and other dependencies would be downloaded by CMake

      - name: Configure
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DF3D_WINDOWS_BUILD_SHELL_THUMBNAILS_EXTENSION=ON \
            -DF3D_PLUGIN_BUILD_OPEN3SDCM=ON \
            -DF3D_PLUGIN_BUILD_HDF=ON \
            -DF3D_MODULE_UI=ON \
            -DF3D_MODULE_TINYFILEDIALOGS=ON \
            -DF3D_MODULE_DMON=ON \
            -G Ninja

      - name: Build
        run: cmake --build build-release --config Release -j$(Get-CimInstance Win32_ComputerSystem | Select-Object -ExpandProperty NumberOfLogicalProcessors)

      - name: Create Windows package
        run: |
          mkdir -p package
          cp build-release/bin/Release/f3d.exe package/
          cp build-release/bin/Release/*.dll package/ 2>/dev/null || true
          cp -r build-release/lib/Release/*.dll package/ 2>/dev/null || true
          # Create zip
          Compress-Archive -Path package/* -DestinationPath F3D-DCM-${{ github.ref_name }}-Windows.zip

      - name: Upload Windows ZIP
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: F3D-DCM-${{ github.ref_name }}-Windows.zip
          asset_name: F3D-DCM-${{ github.ref_name }}-Windows.zip
          asset_content_type: application/zip

  # Build for Linux
  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgl1-mesa-dev libx11-dev libxt-dev

      - name: Configure
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DF3D_PLUGIN_BUILD_OPEN3SDCM=ON \
            -DF3D_PLUGIN_BUILD_HDF=ON \
            -DF3D_MODULE_UI=ON \
            -DF3D_MODULE_TINYFILEDIALOGS=ON \
            -DF3D_MODULE_DMON=ON \
            -G Ninja

      - name: Build
        run: cmake --build build-release -j$(nproc)

      - name: Create Linux package
        run: |
          mkdir -p package/bin
          cp build-release/bin/f3d package/bin/
          cp build-release/lib/*.so* package/bin/ 2>/dev/null || true
          cp -r build-release/lib/f3d-plugin-*.so package/bin/ 2>/dev/null || true
          tar -czvf F3D-DCM-${{ github.ref_name }}-Linux.tar.gz package/

      - name: Upload Linux tarball
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: F3D-DCM-${{ github.ref_name }}-Linux.tar.gz
          asset_name: F3D-DCM-${{ github.ref_name }}-Linux.tar.gz
          asset_content_type: application/gzip
