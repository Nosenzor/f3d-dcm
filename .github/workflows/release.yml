name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: F3D-DCM ${{ github.ref_name }}
          body: |
            F3D-DCM (Fast and minimalist 3D viewer with DICOM/Open3SDCM support) release ${{ github.ref_name }}
            
            **Features:**
            - Based on F3D v3.5.0
            - Open3SDCM plugin for DICOM support
            - HDF plugin for HDF5 file support
            
            **Build Instructions:**
            See [CONTRIBUTING.md](https://github.com/Nosenzor/f3d-dcm/blob/${{ github.ref_name }}/CONTRIBUTING.md) for build instructions.
            
            **Pre-built Binaries:**
            macOS binaries are available in the [releases](https://github.com/Nosenzor/f3d-dcm/releases) section.
          files: |
            # Upload any pre-built binaries from the repo
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
