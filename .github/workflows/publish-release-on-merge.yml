name: Publish release on branch merge

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

jobs:
  publish_release:
    name: Publish release
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'copilot/fix-build-errors-and-run-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v8
        with:
          script: |
            const mergeSha = context.payload.pull_request.merge_commit_sha;
            const tag = `auto-release-${mergeSha.substring(0, 7)}`;
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.info(`Release already exists for tag ${tag}`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha: mergeSha,
                });
              } else {
                throw error;
              }
            }

            try {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: mergeSha,
                name: `Release for ${context.payload.pull_request.head.ref} merge`,
                generate_release_notes: true,
                draft: false,
                prerelease: false,
              });
            } catch (error) {
              if (
                error.status === 422 &&
                (
                  error.response?.data?.errors?.some(
                    (apiError) => apiError?.code === "already_exists",
                  ) ||
                  (typeof error.message === "string" &&
                    error.message.includes("already_exists"))
                )
              ) {
                core.info(`Release already exists for tag ${tag}`);
              } else {
                throw error;
              }
            }
